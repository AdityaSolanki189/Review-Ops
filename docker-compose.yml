services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: reviewops-postgres
        restart: unless-stopped
        ports:
            - '5433:5432'
        environment:
            POSTGRES_USER: reviewops
            POSTGRES_PASSWORD: reviewops
            POSTGRES_DB: reviewops
        volumes:
            - reviewops_pg_data:/var/lib/postgresql/data

volumes:
    reviewops_pg_data:
